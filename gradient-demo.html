<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated gradient — demo</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="css/animated-gradient.css">
<style>
 body{margin:0;background:#08080B;color:#ECEAF4;font:400 1rem/1.6 system-ui,sans-serif}
 .demo{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}
 .demo>div:not(.ag-bg){position:relative;z-index:1;max-width:34rem}
 h2{margin:0 0 10px;font-size:clamp(1.6rem,4vw,2.4rem)} p{margin:0;color:#c9c6d8}
</style></head><body>
<!-- 1) original palette, breathing on -->
<section class="demo" data-animated-gradient data-breathing="true"><div><h2>Original palette</h2><p>Radial gradient with the slow breathing effect.</p></div></section>
<!-- 2) ISMAIL.STUDIO violet palette -->
<section class="demo" data-animated-gradient data-breathing="true" data-colors="#08080B,#2A1B5E,#8B5CF6,#A78BFA,#C4B5FD,#08080B" data-stops="35,50,62,75,88,100"><div><h2>Violet palette</h2><p>Same component, colours matched to the portfolio.</p></div></section>
<script src="js/animated-gradient.js"></script>
</body></html>
