<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel flow field — demo</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pixel-flow-field.css">
<style>
 :root{--bg:#08080B;--text:#ECEAF4;--muted:#9A97AB;--violet:#8B5CF6}
 body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
 .demo{height:100vh;min-height:420px}
 .demo + .demo{height:70vh;border-top:1px solid rgba(255,255,255,.09)}
 .over{position:absolute;inset:auto 0 24px 0;text-align:center;color:var(--muted);font-size:.9rem}
 button{font:inherit;background:var(--violet);color:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer;margin-left:10px}
</style></head><body>
<!-- 1) word, square cells, site tokens -->
<section class="demo" data-pixel-flow-field data-text="ismail" id="a">
  <p class="over">Move your pointer over the field <button type="button" onclick="document.getElementById('a').__pff.scatter()">Scatter</button></p>
</section>
<!-- 2) another word, circles + cross-free violet ramp -->
<section class="demo" data-pixel-flow-field data-text="studio" data-shape="circle" data-cell-size="7" data-gap="3" data-colors="rgba(139,92,246,.5),#A78BFA,#ECEAF4"></section>
<script src="js/pixel-flow-field.js"></script>
</body></html>
